<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Kagazat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap');
        * { font-family: 'Noto Sans Devanagari', sans-serif; }
        body { font-size: 15px; }
        .text-xl  { font-size: 1rem   !important; }
        .text-2xl { font-size: 1.2rem !important; }
        .text-3xl { font-size: 1.4rem !important; }

        .form-input {
            width: 100%; padding: 10px 14px;
            border: 1px solid #d1d5db; border-radius: 8px;
            font-size: 15px; outline: none; transition: border-color .2s;
        }
        .form-input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
        .input-wrapper { position: relative; }
        .toggle-pw {
            position: absolute; right: 12px; top: 50%;
            transform: translateY(-50%);
            cursor: pointer; color: #6b7280; background: none; border: none; font-size: 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner {
            display: inline-block; width: 16px; height: 16px;
            border: 2px solid #fff; border-top-color: transparent;
            border-radius: 50%; animation: spin .6s linear infinite;
            vertical-align: middle; margin-right: 4px;
        }
        #pwStrengthBar { transition: width .3s, background .3s; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <nav class="border-b border-gray-200 bg-white">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-3xl font-bold text-blue-600">Kagazat</a>
            <a href="login.html" class="text-gray-700 hover:text-blue-600 text-lg font-medium">
                Login करें →
            </a>
        </div>
    </nav>

    <main class="flex-1 flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-lg">
            <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-8">

                <div class="text-center mb-8">
                    <div class="w-14 h-14 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                        </svg>
                    </div>
                    <h1 class="text-4xl font-bold text-gray-900">नया खाता बनाएं</h1>
                    <p class="text-gray-500 mt-2 text-lg">Register on Kagazat</p>
                </div>

                <!-- Alert -->
                <div id="alertBanner" class="hidden mb-4 px-4 py-3 rounded-lg text-sm font-medium"></div>

                <form id="registerForm" onsubmit="handleRegister(event)" novalidate class="space-y-4">

                    <!-- Name -->
                    <div>
                        <label class="block text-gray-700 font-semibold text-xl mb-1">
                            पूरा नाम <span class="text-red-500">*</span>
                        </label>
                        <input id="name" type="text" required maxlength="120"
                               placeholder="आपका पूरा नाम"
                               class="form-input"/>
                    </div>

                    <!-- Mobile -->
                    <div>
                        <label class="block text-gray-700 font-semibold text-xl mb-1">मोबाइल नंबर</label>
                        <input id="mobile" type="tel" maxlength="10"
                               placeholder="10-अंकीय मोबाइल (वैकल्पिक)"
                               class="form-input"/>
                    </div>

                    <!-- Address -->
                    <div>
                        <label class="block text-gray-700 font-semibold text-xl mb-1">पता / Address</label>
                        <input id="address" type="text" maxlength="300"
                               placeholder="मकान नं., गली, मोहल्ला"
                               class="form-input"/>
                    </div>

                    <!-- City / Country -->
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-gray-700 font-semibold text-xl mb-1">शहर / City</label>
                            <input id="city" type="text" maxlength="80"
                                   placeholder="Prayagraj"
                                   class="form-input"/>
                        </div>
                        <div>
                            <label class="block text-gray-700 font-semibold text-xl mb-1">देश / Country</label>
                            <input id="country" type="text" maxlength="80"
                                   value="India"
                                   class="form-input"/>
                        </div>
                    </div>

                    <!-- Email -->
                    <div>
                        <label class="block text-gray-700 font-semibold text-xl mb-1">
                            ईमेल <span class="text-red-500">*</span>
                        </label>
                        <input id="email" type="email" required autocomplete="email"
                               placeholder="example@email.com"
                               class="form-input"/>
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="block text-gray-700 font-semibold text-xl mb-1">
                            पासवर्ड <span class="text-red-500">*</span>
                        </label>
                        <div class="input-wrapper">
                            <input id="password" type="password" required
                                   oninput="checkStrength(this.value)"
                                   placeholder="••••••••"
                                   class="form-input pr-10"/>
                            <button type="button" class="toggle-pw" onclick="togglePw('password',this)">👁</button>
                        </div>
                        <div class="mt-1.5 h-1.5 bg-gray-200 rounded-full overflow-hidden">
                            <div id="pwStrengthBar" class="h-full rounded-full w-0"></div>
                        </div>
                        <p id="pwStrengthText" class="text-xs mt-1 text-gray-400"></p>
                        <ul class="text-xs text-gray-400 mt-1 space-y-0.5 list-disc list-inside">
                            <li>8+ अक्षर, बड़ा+छोटा+अंक</li>
                        </ul>
                    </div>

                    <button id="registerBtn" type="submit"
                            class="w-full bg-blue-600 text-white py-4 rounded-lg font-bold text-xl
                                   hover:bg-blue-700 transition disabled:opacity-60 flex items-center justify-center">
                        Register करें →
                    </button>

                </form>

                <p class="text-center mt-6 text-gray-600 text-lg">
                    पहले से खाता है?
                    <a href="login.html" class="text-blue-600 font-semibold hover:underline ml-1">Login करें</a>
                </p>

            </div>
        </div>
    </main>

    <script>
    const API_URL =
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1"
            ? "http://127.0.0.1:5000"
            : '';

    function showAlert(msg, type = "error") {
        const el = document.getElementById("alertBanner");
        el.textContent = msg;
        el.className = [
            "mb-4 px-4 py-3 rounded-lg text-sm font-medium",
            type === "error"
                ? "bg-red-50 text-red-700 border border-red-200"
                : "bg-green-50 text-green-700 border border-green-200",
        ].join(" ");
        el.classList.remove("hidden");
    }

    function setLoading(loading) {
        const btn = document.getElementById("registerBtn");
        btn.disabled = loading;
        btn.innerHTML = loading
            ? '<span class="spinner"></span> Register हो रहा है...'
            : "Register करें →";
    }

    function togglePw(id, btn) {
        const el = document.getElementById(id);
        el.type  = el.type === "password" ? "text" : "password";
        btn.textContent = el.type === "password" ? "👁" : "🙈";
    }

    function checkStrength(pw) {
        let score = 0;
        if (pw.length >= 8)           score++;
        if (/[A-Z]/.test(pw))         score++;
        if (/[a-z]/.test(pw))         score++;
        if (/[0-9]/.test(pw))         score++;
        if (/[^A-Za-z0-9]/.test(pw))  score++;

        const bar    = document.getElementById("pwStrengthBar");
        const text   = document.getElementById("pwStrengthText");
        const widths = ["0%","20%","40%","65%","85%","100%"];
        const colors = ["","#ef4444","#f97316","#eab308","#22c55e","#16a34a"];
        const labels = ["","बहुत कमज़ोर","कमज़ोर","ठीक है","मजबूत","बहुत मजबूत"];
        bar.style.width      = widths[score];
        bar.style.background = colors[score];
        text.textContent     = score ? labels[score] : "";
        text.style.color     = colors[score];
    }

    async function handleRegister(e) {
        e.preventDefault();

        // ── BUG FIX: use correct variable names ──
        const name     = document.getElementById("name").value.trim();
        const mobile   = document.getElementById("mobile").value.trim();
        const address  = document.getElementById("address").value.trim();
        const city     = document.getElementById("city").value.trim();
        const country  = document.getElementById("country").value.trim() || "India";
        const email    = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!name)  { showAlert("कृपया नाम दर्ज करें।"); return; }
        if (!email) { showAlert("कृपया ईमेल दर्ज करें।"); return; }

        if (mobile && !/^[6-9]\d{9}$/.test(mobile)) {
            showAlert("मोबाइल नंबर 10 अंकों का होना चाहिए (6-9 से शुरू)।"); return;
        }

        setLoading(true);

        try {
            const res  = await fetch(API_URL + "/register", {
                method:  "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify({ name, mobile, address, city, country, email, password }),
            });
            const data = await res.json();

            if (data.status === "success") {
                showAlert("Registration सफल! अब login करें।", "success");
                setTimeout(() => (window.location.href = "login.html"), 1500);
            } else {
                showAlert(data.message || "Registration विफल।");
            }
        } catch (_) {
            showAlert("नेटवर्क त्रुटि। पुनः प्रयास करें।");
        } finally {
            setLoading(false);
        }
    }
    </script>

</body>
</html>
